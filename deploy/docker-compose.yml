services:

  anti-scam-trainer-postgres:
    image: postgres:18.1-bookworm
    container_name: anti-scam-trainer-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  anti-scam-trainer-migrate:
    image: migrate/migrate:v4.19.1

    volumes:
      - ${PROJECT_ROOT}/backend/migrations:/migrations

    depends_on:
      anti-scam-trainer-postgres:
        condition: service_healthy

    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@anti-scam-trainer-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

    restart: "no"

  anti-scam-trainer-backend:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: deploy/docker/backend.Dockerfile

    environment:
      POSTGRES_HOST: anti-scam-trainer-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
      LOG_FOLDER: /tmp/anti-scam-trainer/logs
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_URL: http://anti-scam-trainer-ollama:11434
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30s}
      OLLAMA_CONTEXT_WINDOW_TOKENS: ${OLLAMA_CONTEXT_WINDOW_TOKENS:-8192}
      OLLAMA_OUTPUT_RESERVE_TOKENS: ${OLLAMA_OUTPUT_RESERVE_TOKENS:-0}
      OLLAMA_MEDIUM_RISK_THRESHOLD: ${OLLAMA_MEDIUM_RISK_THRESHOLD:-0.60}
      OLLAMA_HIGH_RISK_THRESHOLD: ${OLLAMA_HIGH_RISK_THRESHOLD:-0.75}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      RATE_LIMIT_REGISTER_CAPACITY: ${RATE_LIMIT_REGISTER_CAPACITY:-5}
      RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-10m}
      RATE_LIMIT_LOGIN_CAPACITY: ${RATE_LIMIT_LOGIN_CAPACITY:-10}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-10m}
      RATE_LIMIT_AI_CAPACITY: ${RATE_LIMIT_AI_CAPACITY:-10}
      RATE_LIMIT_AI_WINDOW: ${RATE_LIMIT_AI_WINDOW:-1m}
      RATE_LIMIT_FREE_PLAY_CAPACITY: ${RATE_LIMIT_FREE_PLAY_CAPACITY:-5}
      RATE_LIMIT_FREE_PLAY_WINDOW: ${RATE_LIMIT_FREE_PLAY_WINDOW:-1m}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS:-10000}
      RATE_LIMIT_BUCKET_TTL: ${RATE_LIMIT_BUCKET_TTL:-20m}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      anti-scam-trainer-migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  anti-scam-trainer-frontend-gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: anti-scam-trainer-frontend-gateway
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - anti-scam-trainer-backend
    restart: unless-stopped

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: anti-scam-trainer-port-forwarder

    command:
      - tcp-listen:5432,fork,reuseaddr
      - tcp-connect:anti-scam-trainer-postgres:5432

    ports:
      - "127.0.0.1:5432:5432"

    depends_on:
      anti-scam-trainer-postgres:
        condition: service_healthy
