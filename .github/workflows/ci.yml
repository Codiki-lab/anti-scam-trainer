name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend code
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend code
        working-directory: frontend
        run: npm run typecheck

      - name: Run Go unit and contract tests with race detector
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
          if-no-files-found: error

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Docker Compose images
        run: make build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Prepare local configuration
        run: make env

      - name: Apply migrations
        run: make migrate-up

      - name: Roll back the latest migration
        run: make migrate-down

      - name: Apply migrations again
        run: make migrate-up

      - name: Stop migration database
        if: always()
        run: make down
