openapi: 3.1.0
info:
  title: Anti-scam trainer API
  version: v1
  description: |
    Контракт фактически реализованного API тренажёра. Роль доступа учётной записи
    (`user` или `admin`) не является ролью Пользователя в Сценарии (`buyer` или `seller`).
    Каждый ответ приложения содержит заголовок `X-Request-ID`.
servers:
  - url: /
tags:
  - name: Состояние сервиса
    description: Техническая проверка доступности API.
  - name: Аутентификация
    description: Регистрация, вход и текущая учётная запись Пользователя.
  - name: Сценарии
    description: Управление тренировочными Сценариями.
  - name: Прохождения
    description: Управление Прохождениями текущего Пользователя.
paths:
  /api/v1/health:
    get:
      tags: [Состояние сервиса]
      summary: Проверка состояния
      responses:
        '200': { description: Сервис работает, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /api/v1/auth/register:
    post:
      tags: [Аутентификация]
      summary: Регистрация Пользователя
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: Учётная запись создана, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/auth/login:
    post:
      tags: [Аутентификация]
      summary: Вход Пользователя
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '204': { description: Cookie access_token установлена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/v1/auth/logout:
    post:
      tags: [Аутентификация]
      summary: Выход Пользователя
      responses:
        '204': { description: Cookie access_token удалена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/v1/auth/me:
    get:
      tags: [Аутентификация]
      summary: Текущая учётная запись
      security: [{ accessToken: [] }]
      responses:
        '200': { description: Текущая учётная запись, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/v1/training/levels:
    get:
      tags: [Прохождения]
      summary: Открытые уровни ролевой ветки
      security: [{ accessToken: [] }]
      parameters: [{ name: role, in: query, required: true, schema: { type: string, enum: [buyer, seller] } }]
      responses: { '200': { description: Уровни и Открытость, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OpenLevel' } } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/training/levels/{level}/start:
    post:
      tags: [Прохождения]
      summary: Начать или продолжить Прохождение опубликованного Сценария
      security: [{ accessToken: [] }]
      parameters: [{ name: level, in: path, required: true, schema: { type: integer, enum: [1, 2] } }, { name: role, in: query, required: true, schema: { type: string, enum: [buyer, seller] } }]
      responses: { '200': { description: Текущий Шаг сценария с упорядоченными вариантами и историей, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }, '403': { description: Уровень закрыт }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/attempts/{id}/answers:
    post:
      tags: [Прохождения]
      summary: Ответить на текущий Шаг сценария
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [option_id], properties: { option_id: { type: integer } } } } } }
      responses: { '200': { description: Следующий Шаг либо итоговый Балл, Звёзды и разбор, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/GameState' }, { $ref: '#/components/schemas/Completion' }] } } } }, '409': { $ref: '#/components/responses/Conflict' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/attempts/{id}/abandon:
    post:
      tags: [Прохождения]
      summary: Бросить собственное незавершённое Прохождение
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: Прохождение брошено }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios:
    get:
      tags: [Сценарии]
      summary: Список контента для администратора
      security: [{ accessToken: [] }]
      responses: { '200': { description: Сценарии, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminScenario' } } } } }, '403': { description: Требуется роль доступа admin } }
    post:
      tags: [Сценарии]
      summary: Создать черновой Сценарий
      security: [{ accessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminScenarioInput' } } } }
      responses: { '201': { description: Черновик создан, content: { application/json: { schema: { $ref: '#/components/schemas/AdminScenario' } } } }, '403': { description: Требуется роль доступа admin } }
  /api/v1/admin/scenarios/{id}/publish:
    post:
      tags: [Сценарии]
      summary: Опубликовать черновой Сценарий
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: Сценарий опубликован }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      tags: [Сценарии]
      summary: Изменить черновой Сценарий
      security: [{ accessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminScenarioInput' } } } }
      responses: { '204': { description: Сценарий изменён }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Сценарии]
      summary: Архивировать Сценарий
      security: [{ accessToken: [] }]
      responses: { '204': { description: Сценарий архивирован }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios/{id}/deactivate:
    post:
      tags: [Сценарии]
      summary: Деактивировать опубликованный Сценарий
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: Сценарий возвращён в черновик }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios/{id}/restore:
    post:
      tags: [Сценарии]
      summary: Восстановить архивный Сценарий как черновик
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: Сценарий восстановлен как черновик }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios/{id}/steps:
    post:
      tags: [Сценарии]
      summary: Добавить Шаг сценария в черновик
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStepInput' } } } }
      responses: { '201': { description: Шаг создан, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStep' } } } }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/scenarios/{id}/steps/{step_id}:
    parameters: [{ $ref: '#/components/parameters/ID' }, { name: step_id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Сценарии]
      summary: Изменить Шаг сценария в черновике
      security: [{ accessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStepInput' } } } }
      responses: { '204': { description: Шаг изменён }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Сценарии]
      summary: Удалить Шаг сценария из черновика
      security: [{ accessToken: [] }]
      responses: { '204': { description: Шаг удалён }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/steps/{id}/options:
    post:
      tags: [Сценарии]
      summary: Добавить вариант Ответа пользователя в черновик
      security: [{ accessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOptionInput' } } } }
      responses: { '201': { description: Вариант создан, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOption' } } } }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/steps/{id}/options/{option_id}:
    parameters: [{ $ref: '#/components/parameters/ID' }, { name: option_id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Сценарии]
      summary: Изменить вариант Ответа пользователя в черновике
      security: [{ accessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOptionInput' } } } }
      responses: { '204': { description: Вариант изменён }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Сценарии]
      summary: Удалить вариант Ответа пользователя из черновика
      security: [{ accessToken: [] }]
      responses: { '204': { description: Вариант удалён }, '403': { description: Требуется роль доступа admin }, '409': { $ref: '#/components/responses/Conflict' } }
components:
  headers:
    RequestID: { description: Идентификатор HTTP-запроса, schema: { type: string } }
  securitySchemes:
    accessToken: { type: apiKey, in: cookie, name: access_token, description: Подписанная JWT cookie; устанавливается после входа. }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    BadRequest: { description: Некорректный JSON, пустые обязательные поля или неверный ID, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
    Unauthorized: { description: Отсутствующая, невалидная или истёкшая cookie access_token, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
    Conflict: { description: Логин уже занят, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
    NotFound: { description: Ресурс не найден или Прохождение принадлежит другому Пользователю, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
    MethodNotAllowed: { description: Метод не поддерживается, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
    InternalServerError: { description: Внутренняя ошибка, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { text/plain: { schema: { type: string } } } }
  schemas:
    Health: { type: object, required: [status], properties: { status: { type: string, example: ok } } }
    Credentials: { type: object, required: [username, password], properties: { username: { type: string, minLength: 1, example: alex }, password: { type: string, minLength: 1, format: password, writeOnly: true, example: secret } } }
    Account: { type: object, required: [id, username, access_role], properties: { id: { type: integer, example: 1 }, username: { type: string, example: alex }, access_role: { type: string, enum: [user, admin], description: Роль доступа учётной записи. } } }
    ScenarioInput: { type: object, required: [title, description, difficulty, role, is_active], properties: { title: { type: string, example: Безопасная доставка }, description: { type: string, example: Покупатель обсуждает доставку товара. }, difficulty: { type: string, example: '1' }, role: { type: string, enum: [buyer, seller], description: Роль Пользователя в Сценарии, а не роль доступа учётной записи. }, is_active: { type: boolean, example: true } } }
    Scenario: { allOf: [{ $ref: '#/components/schemas/ScenarioInput' }, { type: object, required: [id], properties: { id: { type: integer, example: 1 } } }] }
    AttemptInput: { type: object, required: [scenario_id, status, started_at, finished_at, score], properties: { scenario_id: { type: integer, example: 1 }, status: { type: string, example: IN_PROGRESS }, started_at: { type: string, format: date-time, example: '2026-08-07T18:00:00Z' }, finished_at: { type: string, format: date-time, example: '0001-01-01T00:00:00Z' }, score: { type: integer, example: 0 } } }
    Attempt: { allOf: [{ $ref: '#/components/schemas/AttemptInput' }, { type: object, required: [id], properties: { id: { type: integer, example: 1 } } }] }
    OpenLevel: { type: object, required: [number, opened, scenario_id], properties: { number: { type: integer, enum: [1, 2] }, opened: { type: boolean }, scenario_id: { type: integer } } }
    ScenarioOption: { type: object, required: [id, text], properties: { id: { type: integer }, text: { type: string } } }
    ScenarioStep: { type: object, required: [id, number, goal, options], properties: { id: { type: integer }, number: { type: integer }, goal: { type: string }, options: { type: array, items: { $ref: '#/components/schemas/ScenarioOption' } } } }
    AnswerHistory: { type: object, required: [step_id, option_id], properties: { step_id: { type: integer }, option_id: { type: integer } } }
    GameState: { type: object, required: [attempt_id, scenario_id, step, answers], properties: { attempt_id: { type: integer }, scenario_id: { type: integer }, step: { $ref: '#/components/schemas/ScenarioStep' }, answers: { type: array, items: { $ref: '#/components/schemas/AnswerHistory' } } } }
    AnswerBreakdown: { type: object, required: [step_id, option_id, option_text, points, explanation], properties: { step_id: { type: integer }, option_id: { type: integer }, option_text: { type: string }, points: { type: integer }, explanation: { type: string } } }
    Completion: { type: object, required: [attempt_id, score, stars, answers], properties: { attempt_id: { type: integer }, score: { type: integer, minimum: 0, maximum: 100 }, stars: { type: integer, minimum: 0, maximum: 3 }, answers: { type: array, items: { $ref: '#/components/schemas/AnswerBreakdown' } } } }
    AdminScenarioInput: { type: object, required: [title, description, level_id, role], properties: { title: { type: string }, description: { type: string }, level_id: { type: integer, minimum: 1 }, role: { type: string, enum: [buyer, seller] } } }
    AdminScenario: { allOf: [{ $ref: '#/components/schemas/AdminScenarioInput' }, { type: object, required: [id, status], properties: { id: { type: integer }, status: { type: string, enum: [draft, published, archived] } } }] }
    AdminStepInput: { type: object, required: [number, response_type, goal, max_points], properties: { number: { type: integer, minimum: 1 }, response_type: { type: string, enum: [multiple_choice, similar_choice] }, goal: { type: string }, max_points: { type: integer, enum: [0, 25, 50, 75, 100] } } }
    AdminStep: { allOf: [{ $ref: '#/components/schemas/AdminStepInput' }, { type: object, required: [id], properties: { id: { type: integer } } }] }
    AdminOptionInput: { type: object, required: [text, explanation, points, sort_order], properties: { text: { type: string }, explanation: { type: string }, points: { type: integer, enum: [0, 25, 50, 75, 100] }, sort_order: { type: integer, minimum: 0 } } }
    AdminOption: { allOf: [{ $ref: '#/components/schemas/AdminOptionInput' }, { type: object, required: [id], properties: { id: { type: integer } } }] }
