components:
  securitySchemes:
    accessToken: { type: apiKey, in: cookie, name: access_token }
  headers:
    RequestID: { description: Идентификатор запроса для корреляции с логами, schema: { type: string } }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    StepID: { name: step_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    OptionID: { name: option_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Role: { name: role, in: query, required: true, schema: { $ref: '#/components/schemas/UserRole' } }
    TopicID: { name: topic_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    Health: { description: Сервис работает, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: ok } } } } } }
    BadRequest: { description: VALIDATION_ERROR, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthorized: { description: AUTHENTICATION_REQUIRED, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: FORBIDDEN для прав доступа или CONTENT_UNAVAILABLE для закрытого учебного контента, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: NOT_FOUND; также скрывает чужие ресурсы, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: STATE_CONFLICT, STALE_STEP или CONTENT_UNAVAILABLE, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    BadGateway: { description: Непоправимый AI_INVALID_RESPONSE; состояние не изменено. Повторно невалидный structured JSON evaluator-а обрабатывается детерминированной fallback-оценкой score=1..3 по тексту Ответа пользователя и не возвращает ошибку, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ServiceUnavailable: { description: AI_UNAVAILABLE; состояние не изменено, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    RateLimited: { description: RATE_LIMITED; дорогая операция не начата, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' }, Retry-After: { description: Целое число секунд до повторной попытки, schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    UserRole: { type: string, enum: [buyer, seller] }
    Credentials: { type: object, required: [username, password], properties: { username: { type: string, minLength: 1 }, password: { type: string, minLength: 1, format: password, writeOnly: true } }, additionalProperties: false }
    Registration: { type: object, required: [username, password, training_role], properties: { username: { type: string, minLength: 1 }, password: { type: string, minLength: 1, format: password, writeOnly: true }, training_role: { $ref: '#/components/schemas/UserRole' } }, additionalProperties: false }
    Streak: { type: object, required: [current, longest, active_today], properties: { current: { type: integer, minimum: 0 }, longest: { type: integer, minimum: 0 }, active_today: { type: boolean }, last_activity_date: { type: string, format: date } } }
    Account: { type: object, required: [id, username, access_role, training_role, streak], properties: { id: { type: integer }, username: { type: string }, access_role: { type: string, enum: [user, admin] }, training_role: { $ref: '#/components/schemas/UserRole' }, streak: { $ref: '#/components/schemas/Streak' } } }
    TheoryBlock: { type: object, required: [id, sort_order, kind, title, body], properties: { id: { type: integer }, sort_order: { type: integer, minimum: 1, maximum: 5 }, kind: { type: string }, title: { type: string }, body: { type: string } } }
    LevelState: { type: object, required: [number, opened, scenario_id, scenario_title, scenario_description, response_type], properties: { number: { type: integer, minimum: 1, maximum: 4 }, opened: { type: boolean }, scenario_id: { type: integer }, scenario_title: { type: string }, scenario_description: { type: string }, response_type: { type: string, enum: [multiple_choice, similar_choice, mixed, free_text] }, in_progress_attempt_id: { type: integer, minimum: 1 } } }
    TopicLevelProgress: { type: object, required: [number, opened, best_score, stars, attempts, last_attempt_id], properties: { number: { type: integer }, opened: { type: boolean }, best_score: { type: integer }, stars: { type: integer, minimum: 0, maximum: 3 }, attempts: { type: integer }, last_attempt_id: { type: integer } } }
    Topic: { type: object, required: [id, slug, role, title, description, sort_order, theory_read, quiz_passed, quiz_best_score, completed, levels], properties: { id: { type: integer }, slug: { type: string }, role: { $ref: '#/components/schemas/UserRole' }, title: { type: string }, description: { type: string }, sort_order: { type: integer }, theory_read: { type: boolean }, quiz_passed: { type: boolean }, quiz_best_score: { type: integer }, completed: { type: boolean }, levels: { type: array, items: { $ref: '#/components/schemas/TopicLevelProgress' } } } }
    QuizOption: { type: object, required: [id, text], properties: { id: { type: integer }, text: { type: string } } }
    QuizQuestion: { type: object, required: [id, sort_order, text, options], properties: { id: { type: integer }, sort_order: { type: integer }, text: { type: string }, options: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/QuizOption' } } } }
    Quiz: { type: object, required: [questions, pass_threshold], properties: { questions: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/QuizQuestion' } }, pass_threshold: { const: 80 } } }
    QuizAnswer: { type: object, required: [question_id, option_id], properties: { question_id: { type: integer }, option_id: { type: integer } }, additionalProperties: false }
    QuizResult: { type: object, required: [score, passed, best_score, newly_passed, streak], properties: { score: { type: integer, minimum: 0, maximum: 100 }, passed: { type: boolean }, best_score: { type: integer }, newly_passed: { type: boolean }, streak: { $ref: '#/components/schemas/Streak' } } }
    GameOption: { type: object, required: [id, text], properties: { id: { type: integer }, text: { type: string, maxLength: 140 } } }
    GameStep: { type: object, required: [id, number, counterparty_message, options], properties: { id: { type: integer }, number: { type: integer }, counterparty_message: { type: string, maxLength: 280 }, options: { type: array, items: { $ref: '#/components/schemas/GameOption' } } } }
    DialogueMessage: { type: object, required: [role, text], properties: { role: { type: string, enum: [user, assistant] }, text: { type: string, maxLength: 400 } } }
    ProductContext: { type: object, required: [item_title, category, deal_method], additionalProperties: false, properties: { item_title: { type: string, minLength: 1 }, category: { type: string, minLength: 1 }, deal_method: { type: string, enum: [delivery, meetup, pickup] }, price: { type: integer, minimum: 0 }, currency: { type: string, enum: [RUB] }, location: { type: string }, image_key: { type: string, enum: [smartphone, electronics, appliance, camera, bicycle, laptop, headphones, console] } } }
    StepProgress: { type: object, required: [current, answered, total], properties: { current: { type: integer, minimum: 0 }, answered: { type: integer, minimum: 0 }, total: { type: integer, minimum: 1 } } }
    SubmittedAnswer: { type: object, required: [step_id, answer_type, points], properties: { step_id: { type: integer, minimum: 0 }, answer_type: { type: string, enum: [option, free_text] }, option_id: { type: integer, minimum: 1 }, option_text: { type: string }, free_text: { type: string }, points: { type: integer, enum: [0, 25, 50, 75, 100] } } }
    GameState: { type: object, required: [attempt_id, status, scenario_id, scenario_title, scenario_description, topic_id, topic_title, level, user_role, counterparty_role, product_context, mode, step_progress, step, answers, messages, can_finish_early], properties: { attempt_id: { type: integer }, status: { type: string, enum: [IN_PROGRESS, COMPLETED, ABANDONED] }, scenario_id: { type: integer, minimum: 0 }, scenario_title: { type: string }, scenario_description: { type: string }, topic_id: { type: integer, minimum: 0 }, topic_title: { type: string }, level: { type: integer, minimum: 0, maximum: 4 }, user_role: { $ref: '#/components/schemas/UserRole' }, counterparty_role: { $ref: '#/components/schemas/UserRole' }, product_context: { $ref: '#/components/schemas/ProductContext' }, mode: { type: string, enum: [multiple_choice, similar_choice, mixed, free_text] }, step_progress: { $ref: '#/components/schemas/StepProgress' }, step: { $ref: '#/components/schemas/GameStep' }, answers: { type: array, items: { $ref: '#/components/schemas/SubmittedAnswer' } }, messages: { type: array, items: { $ref: '#/components/schemas/DialogueMessage' } }, can_finish_early: { type: boolean } } }
    AnswerCommand: { type: object, required: [step_id], properties: { step_id: { type: integer, minimum: 1 }, option_id: { type: integer, minimum: 1 }, free_text: { type: string, minLength: 1, maxLength: 400 }, finish: { type: boolean, default: false } }, oneOf: [{ required: [option_id], not: { required: [free_text] } }, { required: [free_text], not: { required: [option_id] } }], additionalProperties: false }
    RiskSignal: { type: object, required: [code, label], properties: { code: { type: string }, label: { type: string } } }
    AnswerBreakdown: { type: object, required: [step_id, step_number, answer_type, points, assessment, explanation, safe_action, risk_signals], properties: { step_id: { type: integer }, step_number: { type: integer, minimum: 1 }, answer_type: { type: string, enum: [option, free_text] }, option_id: { type: integer }, option_text: { type: string }, free_text: { type: string }, points: { type: integer, enum: [0, 25, 50, 75, 100] }, assessment: { type: string, enum: [unsafe, risky, mostly_safe, safe] }, explanation: { type: string }, safe_action: { type: string }, risk_signals: { type: array, items: { $ref: '#/components/schemas/RiskSignal' } } } }
    Achievement: { type: object, required: [code, title, description, icon, earned, progress], properties: { code: { type: string, enum: [first_training, five_trainings, perfect_score, first_topic_completed, all_buyer_topics, all_seller_topics, streak_3, streak_7] }, title: { type: string }, description: { type: string }, icon: { type: string }, earned: { type: boolean }, earned_at: { type: string, format: date-time }, progress: { type: object, required: [current, target], properties: { current: { type: integer, minimum: 0 }, target: { type: integer, minimum: 1 } } } } }
    ContinueAction: { type: object, required: [type], properties: { type: { type: string, enum: [resume_attempt, read_theory, take_quiz, start_level, start_free_play] }, topic_id: { type: integer }, level: { type: integer }, attempt_id: { type: integer } } }
