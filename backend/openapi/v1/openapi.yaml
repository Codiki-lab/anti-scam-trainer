openapi: 3.1.0
info:
  title: Anti-scam trainer API
  version: 1.0.0
  description: Канонический контракт 11 пользовательских экранов. Эта версия содержит согласованную разовую несовместимую замену раннего v1.
servers:
  - url: http://localhost:8080
tags:
  - name: Состояние сервиса
  - name: Аутентификация
  - name: Обучение
  - name: Прохождения
  - name: Прогресс
  - name: Демо-интеграция
  - name: Сценарии
  - name: Учебный контент
paths:
  /api/v1/health:
    get:
      tags: [Состояние сервиса]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /api/v1/auth/register:
    post:
      tags: [Аутентификация]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
      responses:
        '201': { description: Учётная запись создана без автоматического входа, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      tags: [Аутентификация]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '204': { description: Вход выполнен; access_token установлен в HttpOnly cookie, headers: { Set-Cookie: { schema: { type: string } }, X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      tags: [Аутентификация]
      security: []
      responses:
        '204': { description: Cookie текущего браузера очищена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
  /api/v1/auth/me:
    get:
      tags: [Аутентификация]
      responses:
        '200': { description: Текущий Пользователь, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/profile/preferences:
    patch:
      tags: [Аутентификация]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [training_role], properties: { training_role: { $ref: '#/components/schemas/UserRole' } }, additionalProperties: false } } } }
      responses:
        '200': { description: Предпочтительная ролевая ветка изменена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/topics:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Шесть Тем выбранной ролевой ветки, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Topic' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/topics/{id}:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Карточка Темы, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/topics/{id}/theory:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Пять упорядоченных theory-блоков, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [topic, blocks], properties: { topic: { $ref: '#/components/schemas/Topic' }, blocks: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/TheoryBlock' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/topics/{id}/theory/read:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Идемпотентная отметка чтения, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [theory_read, newly_read, streak], properties: { theory_read: { const: true }, newly_read: { type: boolean }, streak: { $ref: '#/components/schemas/Streak' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/topics/{id}/quiz:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Quiz без правильных ответов и объяснений, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/topics/{id}/quiz/attempts:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answers], properties: { answers: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/QuizAnswer' } } }, additionalProperties: false } } } }
      responses:
        '200': { description: Результат попытки; 80 процентов открывают практику, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/QuizResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/training/levels:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/Role' }, { $ref: '#/components/parameters/TopicID' }]
      responses:
        '200': { description: Уровни Темы и их открытость, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LevelState' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/training/levels/{level}/start:
    post:
      tags: [Прохождения]
      parameters: [{ name: level, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }, { $ref: '#/components/parameters/Role' }, { $ref: '#/components/parameters/TopicID' }]
      responses:
        '200': { description: Полный GameState, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/training/free-play/start:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Свободная игра без раскрытия типа собеседника, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/attempts/{id}:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Восстановленный GameState собственного Прохождения, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/attempts/{id}/answers:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnswerCommand' } } } }
      responses:
        '200': { description: Следующий GameState или Result, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/GameState' }, { $ref: '#/components/schemas/Result' }] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/attempts/{id}/result:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Неизменный повторно читаемый Result, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/attempts/{id}/abandon:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Прохождение брошено, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/attempts/{id}/micro-question/answer:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answer_index], properties: { answer_index: { type: integer, minimum: 0, maximum: 1 } }, additionalProperties: false } } } }
      responses:
        '200': { description: Результат необязательного микро-вопроса; прогресс не меняется, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/ai/metrics:
    get:
      tags: [Прохождения]
      responses:
        '200': { description: Агрегированные метрики evaluator и детерминированного generator без пользовательских данных, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AIMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/recommendations/next:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Персональная рекомендация только доступного контента, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRecommendation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/topics/{id}/skill-check/start:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Сохранённая Проверка навыка и Снимок до обучения, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
  /api/v1/skill-checks/{id}:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Текущий Снимок Проверки навыка, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
  /api/v1/skill-checks/{id}/answers:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answer], properties: { answer: { type: boolean } }, additionalProperties: false } } } }
      responses:
        '200': { description: Сохранённый вердикт без изменения Прогресса, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
  /api/v1/progress:
    get:
      tags: [Прогресс]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Тематический Прогресс выбранной ролевой ветки, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [role, summary, topics, recent_attempts], properties: { role: { $ref: '#/components/schemas/UserRole' }, summary: { $ref: '#/components/schemas/ProgressSummary' }, topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }, recent_attempts: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/RecentAttempt' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/achievements:
    get:
      tags: [Прогресс]
      responses:
        '200': { description: Восемь достижений, разделённых на earned и available, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [earned, available], properties: { earned: { type: array, items: { $ref: '#/components/schemas/Achievement' } }, available: { type: array, items: { $ref: '#/components/schemas/Achievement' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/dashboard:
    get:
      tags: [Прогресс]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Полное состояние главного экрана с устойчивым Заданием дня по московской дате, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/daily-tasks/answer:
    post:
      tags: [Прогресс]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DailyTaskAnswer' } } } }
      responses:
        '200': { description: Сохранённый Result Ежедневного задания и обновлённая Серия дней, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [daily_task, streak], properties: { daily_task: { $ref: '#/components/schemas/DailyTask' }, streak: { $ref: '#/components/schemas/Streak' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/integrations/avito-chat/recommendations:
    post:
      tags: [Демо-интеграция]
      description: После явного согласия Пользователя принимает только обезличенный Снимок диалога из demo-источника. Полный контекст не сохраняется, AI не вызывается.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRecommendationRequest' } } } }
      responses:
        '200': { description: Опубликованная Тема выбранной Ролевой ветки, безопасное объяснение и серверное следующее действие, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRecommendation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/topics:
    get: { tags: [Учебный контент], responses: { '200': { description: Все Темы независимо от lifecycle, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminTopic' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Учебный контент], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopic' } } } }, responses: { '201': { description: Черновик Темы, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopic' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}:
    get: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { description: Тема с упорядоченными Теорией и Quiz, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopic' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopic' } } } }, responses: { '204': { description: Черновик изменён, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
    delete: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Тема архивирована без удаления истории, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}/publish:
    post: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Полная Тема опубликована атомарно, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}/deactivate:
    post: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Тема возвращена в draft, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}/restore:
    post: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Архивная Тема восстановлена как draft, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}/theory-blocks:
    post: { tags: [Учебный контент], parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTheoryBlock' } } } }, responses: { '201': { description: Блок Теории создан, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTheoryBlock' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/admin/topics/{id}/theory-blocks/{block_id}:
