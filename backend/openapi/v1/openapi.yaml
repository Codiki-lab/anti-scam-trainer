openapi: 3.1.0
info:
  title: Anti-scam trainer API
  version: 1.0.0
  description: Канонический контракт 11 пользовательских экранов. Эта версия содержит согласованную разовую несовместимую замену раннего v1.
servers:
  - url: http://localhost:8080
tags:
  - name: Состояние сервиса
  - name: Аутентификация
  - name: Обучение
  - name: Прохождения
  - name: Прогресс
  - name: Сценарии
paths:
  /api/v1/health:
    get:
      tags: [Состояние сервиса]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /api/v1/auth/register:
    post:
      tags: [Аутентификация]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
      responses:
        '201': { description: Учётная запись создана без автоматического входа, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [Аутентификация]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '204': { description: Вход выполнен; access_token установлен в HttpOnly cookie, headers: { Set-Cookie: { schema: { type: string } }, X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Аутентификация]
      security: []
      responses:
        '204': { description: Cookie текущего браузера очищена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
  /api/v1/auth/me:
    get:
      tags: [Аутентификация]
      responses:
        '200': { description: Текущий Пользователь, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/profile/preferences:
    patch:
      tags: [Аутентификация]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [training_role], properties: { training_role: { $ref: '#/components/schemas/UserRole' } }, additionalProperties: false } } } }
      responses:
        '200': { description: Предпочтительная ролевая ветка изменена, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/topics:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Шесть Тем выбранной ролевой ветки, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Topic' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/topics/{id}:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Карточка Темы, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/topics/{id}/theory:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Пять упорядоченных theory-блоков, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [topic, blocks], properties: { topic: { $ref: '#/components/schemas/Topic' }, blocks: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/TheoryBlock' } } } } } } }
  /api/v1/topics/{id}/theory/read:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Идемпотентная отметка чтения, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [theory_read, newly_read, streak], properties: { theory_read: { const: true }, newly_read: { type: boolean }, streak: { $ref: '#/components/schemas/Streak' } } } } } }
  /api/v1/topics/{id}/quiz:
    get:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Quiz без правильных ответов и объяснений, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/topics/{id}/quiz/attempts:
    post:
      tags: [Обучение]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answers], properties: { answers: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/QuizAnswer' } } }, additionalProperties: false } } } }
      responses:
        '200': { description: Результат попытки; 80 процентов открывают практику, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/QuizResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/training/levels:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/Role' }, { $ref: '#/components/parameters/TopicID' }]
      responses:
        '200': { description: Уровни Темы и их открытость, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LevelState' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/training/levels/{level}/start:
    post:
      tags: [Прохождения]
      parameters: [{ name: level, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }, { $ref: '#/components/parameters/Role' }, { $ref: '#/components/parameters/TopicID' }]
      responses:
        '200': { description: Полный GameState, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/training/free-play/start:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Свободная игра без раскрытия типа собеседника, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/attempts/{id}:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Восстановленный GameState собственного Прохождения, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GameState' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/attempts/{id}/answers:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnswerCommand' } } } }
      responses:
        '200': { description: Следующий GameState или Result, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/GameState' }, { $ref: '#/components/schemas/Result' }] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/attempts/{id}/result:
    get:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Неизменный повторно читаемый Result, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/attempts/{id}/abandon:
    post:
      tags: [Прохождения]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Прохождение брошено, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/progress:
    get:
      tags: [Прогресс]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Тематический Прогресс выбранной ролевой ветки, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [role, summary, topics], properties: { role: { $ref: '#/components/schemas/UserRole' }, summary: { $ref: '#/components/schemas/ProgressSummary' }, topics: { type: array, items: { $ref: '#/components/schemas/Topic' } } } } } } }
  /api/v1/achievements:
    get:
      tags: [Прогресс]
      responses:
        '200': { description: Восемь достижений, разделённых на earned и available, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [earned, available], properties: { earned: { type: array, items: { $ref: '#/components/schemas/Achievement' } }, available: { type: array, items: { $ref: '#/components/schemas/Achievement' } } } } } } }
  /api/v1/dashboard:
    get:
      tags: [Прогресс]
      parameters: [{ $ref: '#/components/parameters/Role' }]
      responses:
        '200': { description: Полное состояние главного экрана; daily_task всегда null, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /api/v1/admin/scenarios:
    get:
      tags: [Сценарии]
      responses: { '200': { description: Список Сценариев с topic_id, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Сценарии]
      responses: { '201': { description: Черновик Сценария, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/admin/scenarios/{id}:
    put: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Черновик изменён } } }
    delete: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Сценарий архивирован } } }
  /api/v1/admin/scenarios/{id}/publish:
    post: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Сценарий опубликован } } }
  /api/v1/admin/scenarios/{id}/deactivate:
    post: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Сценарий возвращён в draft } } }
  /api/v1/admin/scenarios/{id}/restore:
    post: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: Сценарий восстановлен как draft } } }
  /api/v1/admin/scenarios/{id}/steps:
    post: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '201': { description: Шаг с counterparty_message создан } } }
  /api/v1/admin/scenarios/{id}/steps/{step_id}:
    put: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StepID' }], responses: { '204': { description: Шаг изменён } } }
    delete: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StepID' }], responses: { '204': { description: Шаг удалён } } }
  /api/v1/admin/steps/{id}/options:
    post: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '201': { description: Вариант создан } } }
  /api/v1/admin/steps/{id}/options/{option_id}:
    put: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OptionID' }], responses: { '204': { description: Вариант изменён } } }
    delete: { tags: [Сценарии], parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OptionID' }], responses: { '204': { description: Вариант удалён } } }
components:
  securitySchemes:
    accessToken: { type: apiKey, in: cookie, name: access_token }
  headers:
    RequestID: { description: Идентификатор запроса для корреляции с логами, schema: { type: string } }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    StepID: { name: step_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    OptionID: { name: option_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Role: { name: role, in: query, required: true, schema: { $ref: '#/components/schemas/UserRole' } }
    TopicID: { name: topic_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    Health: { description: Сервис работает, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: ok } } } } } }
    BadRequest: { description: VALIDATION_ERROR, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthorized: { description: AUTHENTICATION_REQUIRED, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: FORBIDDEN или недоступный контент, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: NOT_FOUND; также скрывает чужие ресурсы, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: STATE_CONFLICT или STALE_STEP, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    BadGateway: { description: AI_INVALID_RESPONSE; состояние не изменено, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ServiceUnavailable: { description: AI_UNAVAILABLE; состояние не изменено, headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    UserRole: { type: string, enum: [buyer, seller] }
    Credentials: { type: object, required: [username, password], properties: { username: { type: string, minLength: 1 }, password: { type: string, minLength: 1, format: password, writeOnly: true } }, additionalProperties: false }
    Registration: { type: object, required: [username, password, training_role], properties: { username: { type: string, minLength: 1 }, password: { type: string, minLength: 1, format: password, writeOnly: true }, training_role: { $ref: '#/components/schemas/UserRole' } }, additionalProperties: false }
    Streak: { type: object, required: [current, longest, active_today], properties: { current: { type: integer, minimum: 0 }, longest: { type: integer, minimum: 0 }, active_today: { type: boolean }, last_activity_date: { type: string, format: date } } }
    Account: { type: object, required: [id, username, access_role, training_role, streak], properties: { id: { type: integer }, username: { type: string }, access_role: { type: string, enum: [user, admin] }, training_role: { $ref: '#/components/schemas/UserRole' }, streak: { $ref: '#/components/schemas/Streak' } } }
    TheoryBlock: { type: object, required: [id, sort_order, kind, title, body], properties: { id: { type: integer }, sort_order: { type: integer, minimum: 1, maximum: 5 }, kind: { type: string }, title: { type: string }, body: { type: string } } }
    LevelState: { type: object, required: [number, opened, scenario_id], properties: { number: { type: integer, minimum: 1, maximum: 4 }, opened: { type: boolean }, scenario_id: { type: integer } } }
    TopicLevelProgress: { type: object, required: [number, opened, best_score, stars, attempts, last_attempt_id], properties: { number: { type: integer }, opened: { type: boolean }, best_score: { type: integer }, stars: { type: integer, minimum: 0, maximum: 3 }, attempts: { type: integer }, last_attempt_id: { type: integer } } }
    Topic: { type: object, required: [id, slug, role, title, description, sort_order, theory_read, quiz_passed, quiz_best_score, completed, levels], properties: { id: { type: integer }, slug: { type: string }, role: { $ref: '#/components/schemas/UserRole' }, title: { type: string }, description: { type: string }, sort_order: { type: integer }, theory_read: { type: boolean }, quiz_passed: { type: boolean }, quiz_best_score: { type: integer }, completed: { type: boolean }, levels: { type: array, items: { $ref: '#/components/schemas/TopicLevelProgress' } } } }
    QuizOption: { type: object, required: [id, text], properties: { id: { type: integer }, text: { type: string } } }
    QuizQuestion: { type: object, required: [id, sort_order, text, options], properties: { id: { type: integer }, sort_order: { type: integer }, text: { type: string }, options: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/QuizOption' } } } }
    Quiz: { type: object, required: [questions, pass_threshold], properties: { questions: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/QuizQuestion' } }, pass_threshold: { const: 80 } } }
    QuizAnswer: { type: object, required: [question_id, option_id], properties: { question_id: { type: integer }, option_id: { type: integer } }, additionalProperties: false }
    QuizResult: { type: object, required: [score, passed, best_score, newly_passed, streak], properties: { score: { type: integer, minimum: 0, maximum: 100 }, passed: { type: boolean }, best_score: { type: integer }, newly_passed: { type: boolean }, streak: { $ref: '#/components/schemas/Streak' } } }
    GameOption: { type: object, required: [id, text], properties: { id: { type: integer }, text: { type: string, maxLength: 140 } } }
    GameStep: { type: object, required: [id, number, counterparty_message, options], properties: { id: { type: integer }, number: { type: integer }, counterparty_message: { type: string, maxLength: 280 }, options: { type: array, items: { $ref: '#/components/schemas/GameOption' } } } }
    DialogueMessage: { type: object, required: [role, text], properties: { role: { type: string, enum: [user, assistant] }, text: { type: string, maxLength: 400 } } }
    StepProgress: { type: object, required: [current, answered], properties: { current: { type: integer, minimum: 0 }, answered: { type: integer, minimum: 0 } } }
    SubmittedAnswer: { type: object, required: [step_id, option_id], properties: { step_id: { type: integer, minimum: 0 }, option_id: { type: integer, minimum: 0 } } }
    GameState: { type: object, required: [attempt_id, status, scenario_id, topic_id, product_context, mode, step_progress, step, answers, messages, can_finish_early], properties: { attempt_id: { type: integer }, status: { type: string, enum: [IN_PROGRESS, COMPLETED, ABANDONED] }, scenario_id: { type: integer, minimum: 0 }, topic_id: { type: integer, minimum: 0 }, product_context: { type: object, additionalProperties: true }, mode: { type: string, enum: [multiple_choice, similar_choice, mixed, free_text] }, step_progress: { $ref: '#/components/schemas/StepProgress' }, step: { $ref: '#/components/schemas/GameStep' }, answers: { type: array, items: { $ref: '#/components/schemas/SubmittedAnswer' } }, messages: { type: array, items: { $ref: '#/components/schemas/DialogueMessage' } }, can_finish_early: { type: boolean } } }
    AnswerCommand: { type: object, required: [step_id], properties: { step_id: { type: integer, minimum: 0 }, option_id: { type: integer, minimum: 1 }, free_text: { type: string, minLength: 1, maxLength: 400 }, finish: { type: boolean, default: false } }, oneOf: [{ required: [option_id], not: { required: [free_text] } }, { required: [free_text], not: { required: [option_id] } }], additionalProperties: false }
    AnswerBreakdown: { type: object, required: [step_id, points, explanation], properties: { step_id: { type: integer }, option_id: { type: integer }, option_text: { type: string }, free_text: { type: string }, points: { type: integer, enum: [0, 25, 50, 75, 100] }, explanation: { type: string }, risk_signals: { type: array, items: { type: string } } } }
    Achievement: { type: object, required: [code, title, description, icon, earned, progress], properties: { code: { type: string, enum: [first_training, five_trainings, perfect_score, first_topic_completed, all_buyer_topics, all_seller_topics, streak_3, streak_7] }, title: { type: string }, description: { type: string }, icon: { type: string }, earned: { type: boolean }, earned_at: { type: string, format: date-time }, progress: { type: object, required: [current, target], properties: { current: { type: integer, minimum: 0 }, target: { type: integer, minimum: 1 } } } } }
    ContinueAction: { type: object, required: [type], properties: { type: { type: string, enum: [resume_attempt, read_theory, take_quiz, start_level, start_free_play] }, topic_id: { type: integer }, level: { type: integer }, attempt_id: { type: integer } } }
